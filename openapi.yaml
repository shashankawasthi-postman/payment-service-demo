openapi: 3.0.3
info:
  title: Payment Service
  description: Demo microservice for processing payments.
  version: 1.0.0
servers:
  - url: http://localhost:4004
    description: Local dev server
tags:
  - name: payments
    description: Operations on payments
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /payments:
    get:
      tags: [payments]
      summary: List all payments
      operationId: listPayments
      responses:
        '200':
          description: A list of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
    post:
      tags: [payments]
      summary: Create a new payment
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
      responses:
        '201':
          description: Created payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
  /payments/{id}:
    get:
      tags: [payments]
      summary: Get a payment by ID
      operationId: getPayment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The requested payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Not found
    put:
      tags: [payments]
      summary: Update a payment
      operationId: updatePayment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
      responses:
        '200':
          description: Updated payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Not found
    delete:
      tags: [payments]
      summary: Delete a payment
      operationId: deletePayment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
components:
  schemas:
    Payment:
      type: object
      properties:
        id:
          type: string
          description: Unique payment ID
        orderId:
          type: string
          description: Associated order ID
        amount:
          type: number
          description: Payment amount
        currency:
          type: string
          description: ISO 4217 currency code
        status:
          type: string
          description: Payment status (pending, completed, failed, refunded)
      required:
        - id
        - orderId
        - amount
        - currency
        - status
    PaymentInput:
      type: object
      properties:
        id:
          type: string
          description: Unique payment ID
        orderId:
          type: string
          description: Associated order ID
        amount:
          type: number
          description: Payment amount
        currency:
          type: string
          description: ISO 4217 currency code
        status:
          type: string
          description: Payment status (pending, completed, failed, refunded)
